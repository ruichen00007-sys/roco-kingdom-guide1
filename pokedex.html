        const allTypes = ["火","水","草","恶","翼","龙","电","冰","格斗","毒","地面","岩石","虫","幽灵","钢","一般","超能力"];
        let selectedTypes = [];

        function init() {
            renderTypeCheckboxes();
            renderPokemonCards(pokemonData);
            bindEvents();
        }
        function renderTypeCheckboxes() {
            const container = document.getElementById('typeCheckboxes');
            allTypes.forEach(type => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" value="${type}" class="type-check"> <span class="type-badge type-${type}">${type}</span>`;
                container.appendChild(label);
            });
        }
        function renderPokemonCards(data) {
            const grid = document.getElementById('pokedexGrid');
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#aaa;">没有找到匹配的精灵</p>';
                return;
            }
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'pokemon-card';
                card.innerHTML = `
                    <div class="pokemon-header"><span class="pokemon-id">No.${p.number}</span><span class="total-race">种族值 ${p.total}</span></div>
                    <div class="pokemon-name">${p.name}</div>
                    <div class="pokemon-type">${p.type.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</div>
                    <div class="race-summary"><span>HP:${p.race.hp}</span><span>攻:${p.race.atk}</span><span>防:${p.race.def}</span></div>
                    <div class="race-summary"><span>特攻:${p.race.spa}</span><span>特防:${p.race.spd}</span><span>速:${p.race.spe}</span></div>
                    <div class="catch-info">📍 ${p.catch}</div>
                `;
                card.addEventListener('click', () => showDetail(p));
                grid.appendChild(card);
            });
        }
        function filterPokemon() {
            const searchText = document.getElementById('searchInput').value.trim().toLowerCase();
            const raceRange = document.getElementById('raceRange').value;
            const stage = document.getElementById('stageFilter').value;
            selectedTypes = [];
            document.querySelectorAll('.type-check:checked').forEach(cb => selectedTypes.push(cb.value));

            const filtered = pokemonData.filter(p => {
                if (searchText && !p.name.toLowerCase().includes(searchText) && p.number.toString() !== searchText) return false;
                if (selectedTypes.length > 0 && !p.type.some(t => selectedTypes.includes(t))) return false;
                if (raceRange !== 'all') {
                    if (raceRange === '600+') { if (p.total < 600) return false; }
                    else { const [min, max] = raceRange.split('-').map(Number); if (p.total < min || p.total > max) return false; }
                }
                if (stage !== 'all' && p.stage !== stage) return false;
                return true;
            });
            renderPokemonCards(filtered);
        }
        function resetFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('raceRange').value = 'all';
            document.getElementById('stageFilter').value = 'all';
            document.querySelectorAll('.type-check').forEach(cb => cb.checked = false);
            selectedTypes = [];
            renderPokemonCards(pokemonData);
        }
        function bindEvents() {
            document.getElementById('searchInput').addEventListener('input', filterPokemon);
            document.getElementById('raceRange').addEventListener('change', filterPokemon);
            document.getElementById('stageFilter').addEventListener('change', filterPokemon);
            document.getElementById('resetFilter').addEventListener('click', resetFilter);
        }
        function showDetail(pokemon) {
            window.location.href = `pokemon-detail.html?id=${pokemon.id}`;
        }
        init();
    </script>
</body>
</html>
