                    evoHtml = `<div class="evolution-chain"><div class="evo-stage">${p.evolution.prev}</div><div class="evo-arrow">→</div><div class="evo-stage"><strong>${p.name}</strong><br><small>当前</small></div></div><p style="color:#aaa; margin-top:0.5rem;">进化方式：${p.evolution.method}</p>`;
