            if (!keyword) { alert('请输入精灵名称或编号'); return; }
            const found = pokemonData.find(p => p.name.toLowerCase().includes(keyword) || p.number.toString() === keyword);
            if (found) { window.location.href = `pokemon-detail.html?id=${found.id}`; }
            else { alert('未找到匹配的精灵，请尝试其他关键词'); }
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') doSearch(); });
    </script>
</body>
</html>
